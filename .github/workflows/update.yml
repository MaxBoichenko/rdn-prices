name: Обновление цен РДН

on:
  schedule:
    # время в UTC. Результаты SDAC (PL/SK/HU/RO) выходят ~12:45–13:00 CET,
    # результаты РДН Украины — днём по Киеву. Несколько запусков — на случай задержек.
    - cron: "55 11 * * *"
    - cron: "40 12 * * *"
    - cron: "30 13 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Загрузить историю с даты (YYYY-MM-DD), пусто = вчера"
        required: false
      end:
        description: "По дату (YYYY-MM-DD), пусто = завтра"
        required: false

permissions:
  contents: write

concurrency:
  group: rdn-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r scripts/requirements.txt

      - name: Сбор цен
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.end }}" ];   then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          python scripts/fetch_prices.py $ARGS

      - name: Сохранить данные
        if: always()
        run: |
          git config user.name  "rdn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Новых данных нет"
          else
            git commit -m "Цены РДН: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
